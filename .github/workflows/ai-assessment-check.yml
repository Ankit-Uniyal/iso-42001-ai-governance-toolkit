# AI System Assessment Currency Check
# ISO/IEC 42001:2023 | Clause 9.1 - Automated Monitoring
#
# Runs 15-SCRIPTS/ai_assessment_checker.py on a schedule to verify that every
# AI system in the inventory has a current assessment, and publishes an
# audit-ready report as a build artifact.
#
# The checker exits with code 1 when overdue or undated systems are found.
# In this repository the step is marked continue-on-error so that the sample
# inventory does not fail the build. Remove continue-on-error when you point
# this workflow at a real AI system inventory and want the pipeline to block.

name: AI Assessment Currency Check

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 08:00 UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read

jobs:
  check-assessments:
    name: Check AI System Assessment Currency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AI Assessment Currency Checker
        id: checker
        continue-on-error: true
        run: |
          python 15-SCRIPTS/ai_assessment_checker.py \
            --input 15-SCRIPTS/sample_ai_systems.csv \
            --threshold 365 \
            --output 15-SCRIPTS/reports/assessment_report.txt

      - name: Upload Assessment Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-assessment-report
          path: 15-SCRIPTS/reports/assessment_report.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Summarise result
        if: always()
        run: |
          if [ "${{ steps.checker.outcome }}" = "success" ]; then
            echo "All AI system assessments are current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Overdue or undated AI system assessments were found - see the ai-assessment-report artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
